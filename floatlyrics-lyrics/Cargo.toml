[package]
name = "floatlyrics-lyrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Lyrics domain logic for FloatLyrics"
repository.workspace = true

[dependencies]
floatlyrics-core = { path = "../floatlyrics-core" }
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
lyrics-helper = "0.5.0"
lindera = { version = "6.0.0", features = ["embed-ipadic", "embed-cc-cedict"] }
jmdict-furigana = "0.1.0"
futures = { version = "0.3", default-features = false, features = ["executor"] }
pinyin = { version = "0.11.0", default-features = false, features = ["with_tone"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust-canto = "0.3.4"

[dev-dependencies]
tempfile = "3"
